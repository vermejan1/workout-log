<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --input-border: #475569;
      --danger: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1.5rem; }
    header { text-align: center; }
    header h1 { font-size: 2rem; font-weight: 700; color: var(--text-main); }
    header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem; }

    .card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 0.75rem; background: var(--input-bg); padding: 0.25rem 0.6rem; border-radius: 20px; color: var(--accent); border: 1px solid var(--card-border); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    label { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
    input { background-color: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; padding: 0.75rem; color: var(--text-main); font-size: 0.95rem; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .btn { background-color: var(--accent); color: #0f172a; border: none; border-radius: 8px; padding: 0.85rem; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s ease; width: 100%; margin-top: 1rem; }
    .btn:hover { background-color: var(--accent-hover); color: #fff; }
    .btn-secondary { background-color: transparent; color: var(--text-muted); border: 1px solid var(--input-border); padding: 0.4rem 0.8rem; font-size: 0.85rem; width: auto; margin-top: 0; }
    .btn-secondary:hover { background-color: var(--input-bg); color: var(--text-main); }
    .btn-cancel { background-color: #475569; color: #fff; margin-top: 0.5rem; display: none; }

    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
    th { background-color: var(--input-bg); color: var(--text-muted); font-weight: 600; padding: 0.75rem 1rem; border-bottom: 1px solid var(--card-border); }
    td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--card-border); }
    tr:hover td { background-color: rgba(255, 255, 255, 0.02); }

    .action-btn { background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 0.2rem 0.4rem; border-radius: 4px; }
    .edit-btn { color: var(--warning); }
    .edit-btn:hover { background: rgba(245, 158, 11, 0.1); }
    .delete-btn { color: var(--danger); }
    .delete-btn:hover { background: rgba(244, 63, 94, 0.1); }

    .config-panel { display: none; background: var(--input-bg); border: 1px dashed var(--input-border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .config-panel.active { display: block; }

    .status-toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 0.8rem 1.2rem; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); transform: translateY(150%); transition: transform 0.3s ease; z-index: 1000; }
    .status-toast.show { transform: translateY(0); }
    .status-toast.success { border-left: 4px solid var(--success); }
    .status-toast.error { border-left: 4px solid var(--danger); }
    .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🏋️ Workout Tracker</h1>
      <p>Log and edit weightlifting sessions seamlessly with Google Sheets</p>
    </header>

    <div class="card">
      <div class="card-title">
        <span id="formTitle">Log Exercise</span>
        <button class="btn btn-secondary" onclick="toggleConfig()">⚙️ Sheet API Config</button>
      </div>

      <div class="config-panel" id="configPanel">
        <div class="form-group">
          <label for="webAppUrl">Google Apps Script Web App URL</label>
          <input type="url" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
      </div>

      <form id="workoutForm">
        <input type="hidden" id="editId" value="">
        <div class="form-grid">
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label for="exercise">Exercise</label>
            <input type="text" id="exercise" placeholder="e.g. Bench Press" required>
          </div>
          <div class="form-group">
            <label for="weight">Weight (lbs)</label>
            <input type="number" id="weight" step="0.5" min="0" placeholder="e.g. 185" required>
          </div>
          <div class="form-group">
            <label for="reps">Reps</label>
            <input type="number" id="reps" min="1" placeholder="e.g. 8" required>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn">Add Workout Entry</button>
        <button type="button" class="btn btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel Editing</button>
      </form>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Recent Entries</span>
        <span class="badge" id="entryCount">0 logged</span>
      </div>

      <div class="table-container">
        <table id="workoutTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Exercise</th>
              <th>Weight</th>
              <th>Reps</th>
              <th style="width: 80px; text-align: center;">Actions</th>
            </tr>
          </thead>
          <tbody id="workoutTableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState">No workout entries logged yet.</div>
      </div>
    </div>
  </div>

  <div class="status-toast" id="statusToast">
    <span id="toastMessage">Entry saved successfully!</span>
  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('webAppUrl').value = localStorage.getItem('workout_sheet_webapp_url') || '';

    let entries = JSON.parse(localStorage.getItem('workout_entries') || '[]');
    renderTable();
    
    // Auto-prepopulate form with latest entry values on page load
    loadLatestEntryIntoForm();

    document.getElementById('webAppUrl').addEventListener('change', (e) => {
      localStorage.setItem('workout_sheet_webapp_url', e.target.value.trim());
      showToast('API URL saved', 'success');
    });

    function toggleConfig() {
      document.getElementById('configPanel').classList.toggle('active');
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('statusToast');
      document.getElementById('toastMessage').innerText = message;
      toast.className = `status-toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    function loadLatestEntryIntoForm() {
      const lastEntry = JSON.parse(localStorage.getItem('last_workout_entry') || 'null');
      if (lastEntry) {
        if (lastEntry.exercise) document.getElementById('exercise').value = lastEntry.exercise;
        if (lastEntry.weight !== undefined) document.getElementById('weight').value = lastEntry.weight;
        if (lastEntry.reps !== undefined) document.getElementById('reps').value = lastEntry.reps;
      }
    }

    document.getElementById('workoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const editId = document.getElementById('editId').value;
      const isEditing = editId !== "";
      const existingItem = isEditing ? entries.find(item => item.id === Number(editId)) : null;

      const entry = {
        id: isEditing ? Number(editId) : Date.now(),
        date: document.getElementById('date').value,
        exercise: document.getElementById('exercise').value.trim(),
        weight: parseFloat(document.getElementById('weight').value),
        reps: parseInt(document.getElementById('reps').value, 10),
        action: isEditing ? 'update' : 'add',
        row: existingItem ? existingItem.row : null
      };

      // Store as last entry so subsequent sets can be logged with 1 click
      localStorage.setItem('last_workout_entry', JSON.stringify({
        exercise: entry.exercise,
        weight: entry.weight,
        reps: entry.reps
      }));

      const webAppUrl = localStorage.getItem('workout_sheet_webapp_url');
      
      if (webAppUrl) {
        showToast(isEditing ? 'Updating Google Sheet...' : 'Saving to Google Sheet...', 'success');
        try {
          const response = await fetch(webAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(entry)
          });
          
          const resData = await response.json();
          if (resData.row) {
            entry.row = resData.row;
          }
          showToast(isEditing ? 'Updated exact set in Google Sheet!' : 'Logged & synced to Google Sheet!', 'success');
        } catch (error) {
          showToast('Saved locally, sync failed.', 'error');
        }
      } else {
        showToast('Saved locally! Set Web App URL to sync.', 'success');
      }

      if (isEditing) {
        entries = entries.map(item => item.id === entry.id ? entry : item);
      } else {
        entries.unshift(entry);
      }

      localStorage.setItem('workout_entries', JSON.stringify(entries));
      renderTable();
      resetForm();
    });

    function startEdit(id) {
      const item = entries.find(e => e.id === id);
      if (!item) return;

      document.getElementById('editId').value = item.id;
      document.getElementById('date').value = item.date;
      document.getElementById('exercise').value = item.exercise;
      document.getElementById('weight').value = item.weight;
      document.getElementById('reps').value = item.reps;

      document.getElementById('formTitle').innerText = '✏️ Edit Exercise Entry';
      document.getElementById('submitBtn').innerText = 'Update Entry';
      document.getElementById('cancelBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editId').value = '';
      document.getElementById('date').valueAsDate = new Date();

      document.getElementById('formTitle').innerText = 'Log Exercise';
      document.getElementById('submitBtn').innerText = 'Add Workout Entry';
      document.getElementById('cancelBtn').style.display = 'none';

      // Keep prefilled values from the last entry
      loadLatestEntryIntoForm();
    }

    function deleteEntry(id) {
      entries = entries.filter(item => item.id !== id);
      localStorage.setItem('workout_entries', JSON.stringify(entries));
      renderTable();
      showToast('Entry deleted locally', 'error');
    }

    function renderTable() {
      const tbody = document.getElementById('workoutTableBody');
      const emptyState = document.getElementById('emptyState');
      const countBadge = document.getElementById('entryCount');

      tbody.innerHTML = '';
      countBadge.innerText = `${entries.length} logged`;

      if (entries.length === 0) {
        emptyState.style.display = 'block';
        document.getElementById('workoutTable').style.display = 'none';
      } else {
        emptyState.style.display = 'none';
        document.getElementById('workoutTable').style.display = 'table';

        entries.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.date}</td>
            <td style="font-weight: 500;">${item.exercise}</td>
            <td>${item.weight} lbs</td>
            <td>${item.reps}</td>
            <td style="text-align: center;">
              <button class="action-btn edit-btn" onclick="startEdit(${item.id})" title="Edit Entry">✏️</button>
              <button class="action-btn delete-btn" onclick="deleteEntry(${item.id})" title="Delete Entry">&times;</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
    }
  </script>
</body>
</html>
